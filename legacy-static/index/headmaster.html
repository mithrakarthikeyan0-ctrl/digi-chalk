<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Digi-Chalk — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../templates/style.css" />
<style>
  .rollup { background: linear-gradient(135deg, var(--color-indigo), #312E81); border:none; display: flex; box-shadow: var(--shadow-md); color: #FBF8F2; padding: 20px;}
  .rollup .rollup-stat { flex: 1; text-align: center; }
  .rollup .caption { color: #E2E8F0; font-weight: 500; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;}
  .rollup .stat { font-size: 36px; font-weight: 800; margin-top: 8px; letter-spacing: -0.5px; }
  .rollup .divider { flex: none; width: 1px; align-self: stretch; background: rgba(255,255,255,0.2); margin: 4px 16px; }
  .sort-row { display: flex; gap: 10px; align-items: center; }
  select.sort-select {
    flex: 1; padding: 10px 14px; border-radius: var(--radius-pill);
    border: 1px solid var(--color-slate); background: var(--paper-2);
    font-family: inherit; font-size: 12px; color: var(--text-primary);
  }
  #classList { display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body data-nav-current="overview">
<div class="app-shell" data-loaded="false">

  <div class="topbar">
    <div>
      <h1 style="font-size:20px;">School overview</h1>
      <!-- INTEGRATION: school.name -->
      <p class="role-label">Sunrise Public School</p>
    </div>
    <div class="topbar-actions">
      <button class="btn-icon" data-global-search aria-label="Search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
      <button class="btn-icon" data-global-notify aria-label="Notifications"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
      <div class="avatar" data-global-profile tabindex="0" role="button" aria-label="Profile and Settings">HM</div>
    </div>
  </div>

  <div class="main">

    <div class="skeleton-block">
      <div class="skeleton skeleton-card" style="height:94px;"></div>
      <div class="skeleton skeleton-card mt-16" style="height:60px;"></div>
      <div class="skeleton skeleton-card mt-16"></div>
      <div class="skeleton skeleton-card mt-16"></div>
    </div>

    <div class="real-content">

      <!-- Phase 4: Date Range & Export -->
      <div class="row-between mb-16">
        <select class="form-input" style="width:auto; padding:6px 12px; font-size:12px; border-radius:12px;" aria-label="Select date range">
          <option>This Week</option>
          <option>Last Week</option>
          <option>This Month</option>
          <option>Year to Date</option>
        </select>
        <button class="btn btn-outline" onclick="if(typeof showToast==='function') showToast('Exporting summary to CSV...', 'success');" style="padding:6px 12px; font-size:12px; min-height:auto; display:flex; align-items:center; gap:6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export CSV
        </button>
      </div>

      <!-- INTEGRATION: GET /api/schools/{schoolId} -> school.avgScore, school.avgInteraction -->
      <div class="card rollup mb-16" style="border-radius:12px;">
        <div class="rollup-stat">
          <p class="caption">Overall average score</p>
          <p class="stat" style="color:var(--color-emerald);">76%</p>
        </div>
        <div class="divider"></div>
        <div class="rollup-stat">
          <p class="caption">Overall engagement</p>
          <p class="stat" style="color:var(--color-amber);">68%</p>
        </div>
      </div>

      <!-- Phase 4: Class Comparison Chart -->
      <div class="card mb-16">
        <h2 style="font-size:14px; margin-bottom:12px;">Top Performing Classes (Score)</h2>
        <div style="display:flex; flex-direction:column; gap:10px;">
          <div class="row" style="gap:8px;">
            <div style="width:30px; font-size:12px; font-weight:600; color:var(--text-secondary);">8B</div>
            <div class="bar-track" style="flex:1; background:var(--paper-dim); height:12px; border-radius:6px;"><div class="bar-fill good" style="width:85%; border-radius:6px;"></div></div>
            <div style="width:30px; font-size:12px; font-weight:700; text-align:right;">85%</div>
          </div>
          <div class="row" style="gap:8px;">
            <div style="width:30px; font-size:12px; font-weight:600; color:var(--text-secondary);">9A</div>
            <div class="bar-track" style="flex:1; background:var(--paper-dim); height:12px; border-radius:6px;"><div class="bar-fill good" style="width:78%; border-radius:6px;"></div></div>
            <div style="width:30px; font-size:12px; font-weight:700; text-align:right;">78%</div>
          </div>
          <div class="row" style="gap:8px;">
            <div style="width:30px; font-size:12px; font-weight:600; color:var(--text-secondary);">7C</div>
            <div class="bar-track" style="flex:1; background:var(--paper-dim); height:12px; border-radius:6px;"><div class="bar-fill" style="width:65%; background:var(--color-indigo); border-radius:6px;"></div></div>
            <div style="width:30px; font-size:12px; font-weight:700; text-align:right;">65%</div>
          </div>
        </div>
      </div>

      <div class="sort-row">
        <select class="sort-select" id="sortSelect" aria-label="Sort classes by">
          <option value="score-asc">Sort: lowest score first</option>
          <option value="score-desc">Sort: highest score first</option>
          <option value="engagement-asc">Sort: lowest engagement first</option>
          <option value="engagement-desc">Sort: highest engagement first</option>
        </select>
        <span class="badge badge-low" id="flagCount">2 flagged</span>
      </div>

      <div id="classList"></div>

      <p class="caption" style="text-align:center;">No teacher names or cross-class comparisons shown.</p>

    </div>
  </div>

  <nav class="bottomnav">
    <a href="headmaster.html" data-nav="overview" class="active">
      <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
      Overview
    </a>
    <a href="#" data-nav="classes">
      <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
      Classes
    </a>
    <a href="#" data-nav="reports">
      <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><rect x="5" y="12" width="3" height="8"/><rect x="10.5" y="7" width="3" height="13"/><rect x="16" y="15" width="3" height="5"/></svg>
      Reports
    </a>
    <a href="#" data-nav="profile">
      <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      Profile
    </a>
  </nav>
</div>

<script src="../templates/script.js"></script>
<script src="../templates/components/scores.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var shell = document.querySelector(".app-shell");
    simulateLoad(shell, function () {
      var select = document.getElementById("sortSelect");
      var list = document.getElementById("classList");
      initClassSort(select, list);

      var flagged = CLASS_DEMO.filter(function (c) { return c.flag; }).length;
      document.getElementById("flagCount").textContent = flagged + " flagged";

      list.addEventListener("click", function (e) {
        var card = e.target.closest(".card");
        if (!card) return;
        var className = card.querySelector("h2") ? card.querySelector("h2").textContent.trim() : "Class";
        var c = CLASS_DEMO.find(function (item) { return item.id === className; }) || { id: className, avgScore: 75, interaction: 70 };
        var modalHtml = '<div class="card" style="box-shadow:none; padding:12px;">' +
          '<div class="row-between"><span class="caption">Average Score</span><span style="font-weight:700; color:var(--color-emerald);">' + c.avgScore + '%</span></div>' +
          '<div class="row-between mt-8"><span class="caption">Student Engagement</span><span style="font-weight:700; color:var(--color-amber);">' + c.interaction + '%</span></div>' +
          '<div class="row-between mt-8"><span class="caption">Active Broadcasts</span><span style="font-weight:600;">22 this month</span></div>' +
          '<div class="row-between mt-8"><span class="caption">Low-Bandwidth Syncs</span><span class="badge badge-good">100% completed</span></div>' +
          '</div>' +
          '<p class="caption mt-8" style="text-align:center;">Digi-Chalk School Analytics &middot; No personal identifiers</p>';
        openModal(className + " &middot; Performance Breakdown", modalHtml);
      });
    });
  });
</script>
</body>
</html>
