<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Digi-Chalk — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../templates/style.css" />
<style>
  .rollup { background: var(--color-indigo); border-color: var(--color-indigo); display: flex; }
  .rollup .rollup-stat { flex: 1; }
  .rollup .caption { color: #CBD5C9; }
  .rollup .stat { font-size: 28px; font-weight: 700; margin-top: 6px; }
  .rollup .divider { flex: none; width: 1px; align-self: stretch; background: #334155; margin: 4px 16px; }
  .sort-row { display: flex; gap: 10px; align-items: center; }
  select.sort-select {
    flex: 1; padding: 10px 14px; border-radius: var(--radius-pill);
    border: 1px solid var(--color-slate); background: var(--paper-2);
    font-family: inherit; font-size: 12px; color: var(--text-primary);
  }
  #classList { display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body data-nav-current="overview">
<div class="app-shell" data-loaded="false">

  <div class="topbar">
    <div>
      <h1 style="font-size:20px;">School overview</h1>
      <!-- INTEGRATION: school.name -->
      <p class="role-label">Sunrise Public School</p>
    </div>
  </div>

  <div class="main">

    <div class="skeleton-block">
      <div class="skeleton skeleton-card" style="height:94px;"></div>
      <div class="skeleton skeleton-card mt-16" style="height:60px;"></div>
      <div class="skeleton skeleton-card mt-16"></div>
      <div class="skeleton skeleton-card mt-16"></div>
    </div>

    <div class="real-content">

      <!-- INTEGRATION: GET /api/schools/{schoolId} -> school.avgScore, school.avgInteraction -->
      <div class="card rollup">
        <div class="rollup-stat">
          <p class="caption">Overall average score</p>
          <p class="stat" style="color:var(--color-emerald);">76%</p>
        </div>
        <div class="divider"></div>
        <div class="rollup-stat">
          <p class="caption">Overall engagement</p>
          <p class="stat" style="color:var(--color-amber);">68%</p>
        </div>
      </div>

      <div class="sort-row">
        <select class="sort-select" id="sortSelect" aria-label="Sort classes by">
          <option value="score-asc">Sort: lowest score first</option>
          <option value="score-desc">Sort: highest score first</option>
          <option value="engagement-asc">Sort: lowest engagement first</option>
          <option value="engagement-desc">Sort: highest engagement first</option>
        </select>
        <span class="badge badge-low" id="flagCount">2 flagged</span>
      </div>

      <div id="classList"></div>

      <p class="caption" style="text-align:center;">No teacher names or cross-class comparisons shown.</p>

    </div>
  </div>

  <nav class="bottomnav">
    <a href="headmaster.html" data-nav="overview" class="active">
      <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
      Overview
    </a>
    <a href="#" data-nav="classes">
      <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
      Classes
    </a>
    <a href="#" data-nav="reports">
      <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><rect x="5" y="12" width="3" height="8"/><rect x="10.5" y="7" width="3" height="13"/><rect x="16" y="15" width="3" height="5"/></svg>
      Reports
    </a>
    <a href="#" data-nav="profile">
      <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      Profile
    </a>
  </nav>
</div>

<script src="../templates/script.js"></script>
<script src="../templates/components/scores.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var shell = document.querySelector(".app-shell");
    simulateLoad(shell, function () {
      var select = document.getElementById("sortSelect");
      var list = document.getElementById("classList");
      initClassSort(select, list);

      var flagged = CLASS_DEMO.filter(function (c) { return c.flag; }).length;
      document.getElementById("flagCount").textContent = flagged + " flagged";

      list.addEventListener("click", function (e) {
        var card = e.target.closest(".card");
        if (!card) return;
        var className = card.querySelector("h2") ? card.querySelector("h2").textContent.trim() : "Class";
        var c = CLASS_DEMO.find(function (item) { return item.id === className; }) || { id: className, avgScore: 75, interaction: 70 };
        var modalHtml = '<div class="card" style="box-shadow:none; padding:12px;">' +
          '<div class="row-between"><span class="caption">Average Score</span><span style="font-weight:700; color:var(--color-emerald);">' + c.avgScore + '%</span></div>' +
          '<div class="row-between mt-8"><span class="caption">Student Engagement</span><span style="font-weight:700; color:var(--color-amber);">' + c.interaction + '%</span></div>' +
          '<div class="row-between mt-8"><span class="caption">Active Broadcasts</span><span style="font-weight:600;">22 this month</span></div>' +
          '<div class="row-between mt-8"><span class="caption">Low-Bandwidth Syncs</span><span class="badge badge-good">100% completed</span></div>' +
          '</div>' +
          '<p class="caption mt-8" style="text-align:center;">Digi-Chalk School Analytics &middot; No personal identifiers</p>';
        openModal(className + " &middot; Performance Breakdown", modalHtml);
      });
    });
  });
</script>
</body>
</html>
