version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digichalk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digichalk"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Exposing port strictly for local development
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      bash -c "
        python manage.py migrate &&
        daphne -b 0.0.0.0 -p 8000 config.asgi:application
      "
    env_file:
      - ./backend/.env.example # Using example as fallback for local dev
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/digichalk
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_DEBUG=True
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/readiness/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    env_file:
      - ./gateway/.env.example
    environment:
      - BACKEND_URL=http://backend:8000/api/v1/gateway
    ports:
      - "8001:8001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/status/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    volumes:
      - .:/usr/share/nginx/html:ro
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  pgdata:
